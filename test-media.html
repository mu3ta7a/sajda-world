<!doctype html><meta charset="utf-8"><title>media test</title>
<pre id="out">start</pre>
<script>
const K=location.hash.slice(1);
const log=s=>{document.getElementById('out').textContent+="\n"+s};
(async()=>{
 try{
  log('keylen '+K.length);
  const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
  await navigator.serviceWorker.ready;
  if(!navigator.serviceWorker.controller){await new Promise(r=>{const t=setTimeout(r,3000);navigator.serviceWorker.addEventListener('controllerchange',()=>{clearTimeout(t);r()})})}
  const sw=navigator.serviceWorker.controller;
  log('controller '+(!!sw));
  const ok=await new Promise(r=>{const t=setTimeout(()=>r(false),2000);const h=e=>{if(e.data&&e.data.type==='mk-ok'){clearTimeout(t);navigator.serviceWorker.removeEventListener('message',h);r(true)}};navigator.serviceWorker.addEventListener('message',h);sw.postMessage({type:'mk',k:K})});
  log('mk-ok '+ok);
  const name='i_IMG_5888.gif';
  const r=await fetch('./mm/'+encodeURIComponent(name));
  const b=await r.arrayBuffer();
  log('status '+r.status+' type '+r.headers.get('content-type')+' bytes '+b.byteLength);
  log('head '+Array.from(new Uint8Array(b.slice(0,6))).join(','));
  const r2=await fetch('./mm/'+encodeURIComponent(name),{headers:{Range:'bytes=1000-1099'}});
  const b2=await r2.arrayBuffer();
  log('range '+r2.status+' bytes '+b2.byteLength+' cr '+r2.headers.get('content-range'));
 }catch(e){log('ERR '+e.message)}
})();
</script>
